<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/ant.svg" />
    <link rel="stylesheet" href="/src/lab/lab.css" />
    <title>games-ants — Спрайты юнитов</title>
  </head>
  <body>
    <header>
      <a class="back" href="/lab.html">←</a>
      <h1>Спрайты юнитов</h1>
      <button id="toggle" type="button">Пауза</button>
      <label>
        Фаза
        <input id="phase" type="range" min="0" max="1" step="0.001" value="0" />
        <output id="phase-value">0.000</output>
      </label>
      <label>
        Темп
        <input id="speed" type="range" min="0" max="3" step="0.05" value="1" />
        <output id="speed-value">1.00×</output>
      </label>
      <label>
        Зум
        <input id="zoom" type="range" min="0.5" max="8" step="0.5" value="1.5" />
        <output id="zoom-value">1.5×</output>
      </label>
      <span class="group">
        Курс
        <button type="button" data-heading="180" title="влево">←</button>
        <button type="button" data-heading="-90" title="вверх">↑</button>
        <button type="button" data-heading="90" title="вниз">↓</button>
        <button type="button" data-heading="0" title="вправо" aria-pressed="true">→</button>
      </span>
      <label>
        Фон
        <select id="background">
          <option value="0x796246">туннель</option>
          <option value="0xa8bbb0">сцена</option>
          <option value="0x6f5137">земля</option>
          <option value="0x2b3440">ночь</option>
          <option value="0xf5f2e9">бумага</option>
          <option value="0x3f7f92">вода</option>
        </select>
      </label>
      <label>
        <input id="cells" type="checkbox" checked />
        Клетки
      </label>
    </header>
    <main><div id="stage"></div></main>
    <script type="module" src="/src/lab/creatures.ts"></script>
  </body>
</html>
