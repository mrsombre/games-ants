packages:
  - "apps/backend"
  - "apps/frontend"
  - "packages/common"
  - "packages/game"
  - "packages/assets"
  - "packages/render"

# Supply-chain delay: refuse versions younger than 7 days.
minimumReleaseAge: 10080

strictDepBuilds: true

allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  sharp: true
  workerd: true
